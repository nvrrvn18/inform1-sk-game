<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Sistem Komputer | Petualangan Belajar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Informatika • Kelas VII</p>
      <h1>Sistem Komputer</h1>
    </div>
    <button id="resetBtn" class="ghost-btn" type="button">Reset</button>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="homeTemplate">
    <section class="hero card">
      <div>
        <span class="pill">Petualangan Belajar</span>
        <h2>Bagaimana sistem komputer bekerja?</h2>
        <p>Amati, susun, perbaiki, dan jalankan sistem sampai seluruh misi selesai.</p>
      </div>
      <div class="hero-visual" aria-hidden="true">⌨️ → 🧠 → 🖥️ → 💾</div>
    </section>

    <section class="card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Perjalanan Belajar</p>
          <h2>Peta Misi</h2>
        </div>
        <span id="progressLabel" class="progress-chip"></span>
      </div>
      <div id="missionMap" class="mission-map"></div>
    </section>

    <section class="card compact-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Hasil Lokal</p>
          <h2>Ringkasan Progress</h2>
        </div>
      </div>
      <div id="summaryGrid" class="summary-grid"></div>
      <button id="exportBtn" class="secondary-btn" type="button">Unduh Hasil Belajar</button>
    </section>
  </template>

  <script src="script.js"></script>
</body>
</html>
